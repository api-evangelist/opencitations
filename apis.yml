- name: OpenCitations SPARQL Endpoint
  description: >-
    SPARQL endpoints for structured queries against the OpenCitations Meta and Index datasets. Provides
    access to the full Linked Open Data graph for both bibliographic metadata and citation entity data
    using the SPARQL query language.
